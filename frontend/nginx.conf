server {
  listen ${PORT};
  listen [::]:${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS server used to look up the backend's address.
  #   Railway:        [fd12::10]   (Railway's private-network DNS)
  #   docker-compose: 127.0.0.11   (Docker's built-in DNS)
  # Re-checks every 5 seconds so a backend redeploy (new IP) is picked up.
  resolver ${DNS_RESOLVER} valid=5s ipv6=on;

  # Everything the website asks from /api/... is forwarded to the backend.
  location /api/ {
    set $backend_upstream ${BACKEND_URL};
    proxy_pass $backend_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
  }

  # Handy test link: https://YOUR-FRONTEND-DOMAIN/health shows the backend's status
  location = /health {
    set $health_upstream ${BACKEND_URL}/health;
    proxy_pass $health_upstream;
  }

  location / {
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
}
